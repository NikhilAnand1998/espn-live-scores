<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07110c">
  <meta name="description" content="Interactive pick 9 draft tree for a 14-team half-PPR fantasy football snake draft.">
  <title>Pick 9 Draft Tree</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="top">
        <div class="logo">9</div>
        <div class="title">
          <b>Pick 9 Draft Tree</b>
          <small>14-team · half-PPR · snake</small>
        </div>
        <button class="control" id="undo" aria-label="Undo last action">↶</button>
        <button class="control reset" id="reset">Reset</button>
      </div>
      <div class="status" id="status"></div>
    </header>

    <section class="intro">
      <div class="audit-badge">MOCK-DRAFT AUDITED</div>
      <h1>Tap the player you draft.</h1>
      <p>Your pick becomes the trunk and the next-round leaves appear underneath. Recommendations change with your roster. Tap <b>Gone</b> when another manager selects one of the displayed players.</p>
      <div class="source-note" id="source-note"></div>
    </section>

    <details class="team" open>
      <summary>Current team · <span id="construction">Empty</span></summary>
      <div id="team"></div>
    </details>

    <main class="tree" id="tree"></main>
  </div>

  <script src="data.js"></script>
  <script src="engine.js"></script>
  <script src="engine-patch.js"></script>
  <script src="app.js"></script>
</body>
</html>
