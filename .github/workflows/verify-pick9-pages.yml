name: Verify Pick 9 Draft Tree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-pick9-pages.yml
      - .github/scripts/verify-pick9.mjs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    env:
      SITE_URL: https://nikhilanand1998.github.io/espn-live-scores/
    steps:
      - name: Check out test script
        uses: actions/checkout@v4

      - name: Install Playwright package
        shell: bash
        run: |
          npm init -y >/dev/null
          npm install --save-exact playwright@1.55.0 >/dev/null

      - name: Run deployed-site end-to-end tests
        shell: bash
        run: node .github/scripts/verify-pick9.mjs
