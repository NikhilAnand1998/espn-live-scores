name: Adversarial UI Review and Deploy

on:
  push:
    branches: [main]
    paths:
      - draft-tree-site/**
      - .github/scripts/build-draft-tree-data.mjs
      - .github/scripts/enrich-draft-tree-consensus.mjs
      - .github/scripts/enrich-draft-tree-external-models.mjs
      - .github/scripts/enrich-draft-tree-lineupbeat.mjs
      - .github/scripts/enrich-draft-tree-market-props.mjs
      - .github/scripts/finalize-draft-tree-model.mjs
      - .github/scripts/patch-actionable-fallers.mjs
      - .github/scripts/ui-adversarial-playwright-v2.mjs
      - .github/scripts/lineup-semantics-playwright.mjs
      - .github/workflows/deploy-audited-draft-tree.yml
  workflow_dispatch:

concurrency:
  group: pick9-adversarial-ui-deploy
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  review-test-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Install build and browser-test packages
        working-directory: source
        run: |
          npm init -y >/dev/null
          npm install --save-exact cheerio@1.1.2 playwright@1.55.0 http-server@14.1.1 >/dev/null

      - name: Build current exact-format data
        run: node source/.github/scripts/build-draft-tree-data.mjs site/data.js

      - name: Add current consensus ranks
        run: node source/.github/scripts/enrich-draft-tree-consensus.mjs site/data.js

      - name: Add supplemental rankings and uncertainty ranges
        continue-on-error: true
        run: node source/.github/scripts/enrich-draft-tree-external-models.mjs site/data.js

      - name: Add independent half-PPR projections
        run: node source/.github/scripts/enrich-draft-tree-lineupbeat.mjs site/data.js

      - name: Add optional market-priced player props
        continue-on-error: true
        run: node source/.github/scripts/enrich-draft-tree-market-props.mjs site/data.js

      - name: Finalize null-safe ensemble values
        run: node source/.github/scripts/finalize-draft-tree-model.mjs site/data.js

      - name: Assemble the exact site bundle to be tested
        run: |
          cp source/draft-tree-site/index.html site/index.html
          cp source/draft-tree-site/style.css site/style.css
          cp source/draft-tree-site/adversarial-tuning.css site/adversarial-tuning.css
          cp source/draft-tree-site/engine.js site/engine.js
          cp source/draft-tree-site/engine-patch.js site/engine-patch.js
          cp source/draft-tree-site/availability.js site/availability.js
          cp source/draft-tree-site/model-meta.js site/model-meta.js
          node source/.github/scripts/patch-actionable-fallers.mjs source/draft-tree-site/app-v2.js site/app-v2.js
          cp source/draft-tree-site/lineup-semantics.js site/lineup-semantics.js
          printf '%s\n' "$GITHUB_SHA" > site/build-id.txt
          rm -f site/patch.js site/app.js site/auto-board.js site/auto-board.css
          touch site/.nojekyll

      - name: Check JavaScript syntax
        run: |
          node --check site/data.js
          node --check site/engine.js
          node --check site/engine-patch.js
          node --check site/availability.js
          node --check site/model-meta.js
          node --check site/app-v2.js
          node --check site/lineup-semantics.js
          node --check source/.github/scripts/patch-actionable-fallers.mjs
          node --check source/.github/scripts/ui-adversarial-playwright-v2.mjs
          node --check source/.github/scripts/lineup-semantics-playwright.mjs

      - name: Start local preview
        working-directory: source
        run: |
          npx http-server ../site -p 4173 -c-1 > /tmp/pick9-http.log 2>&1 &
          echo $! > /tmp/pick9-http.pid
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pick9-http.log
          exit 1

      - name: Run adversarial Playwright audit before deployment
        working-directory: source
        env:
          SITE_URL: http://127.0.0.1:4173/
          REPORT_PATH: ../site/ui-adversarial-report.json
        run: node .github/scripts/ui-adversarial-playwright-v2.mjs

      - name: Verify lineup and actionable-faller semantics locally
        working-directory: source
        env:
          SITE_URL: http://127.0.0.1:4173/
        run: node .github/scripts/lineup-semantics-playwright.mjs

      - name: Upload pre-deployment adversarial report
        uses: actions/upload-artifact@v4
        with:
          name: pick9-ui-adversarial-review
          path: site/ui-adversarial-report.json
          if-no-files-found: error

      - name: Publish only after local Playwright passes
        working-directory: site
        run: |
          git config --global --add safe.directory "$PWD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css adversarial-tuning.css engine.js engine-patch.js availability.js model-meta.js app-v2.js lineup-semantics.js data.js build-id.txt ui-adversarial-report.json .nojekyll
          git add -u
          if git diff --cached --quiet; then
            echo "No site changes to publish."
          else
            git commit -m "Deploy actionable-faller no-retirement draft UX"
            git push origin HEAD:gh-pages
          fi

      - name: Wait for the exact GitHub Pages build
        run: |
          for attempt in $(seq 1 72); do
            public_id="$(curl -fsS -H 'Cache-Control: no-cache' "https://nikhilanand1998.github.io/espn-live-scores/build-id.txt?check=$(date +%s)" 2>/dev/null | tr -d '\r\n' || true)"
            if [ "$public_id" = "$GITHUB_SHA" ]; then
              echo "GitHub Pages is serving build $public_id"
              exit 0
            fi
            echo "Waiting for GitHub Pages build $GITHUB_SHA, attempt $attempt/72 (currently '$public_id')"
            sleep 5
          done
          echo "The exact GitHub Pages build did not appear in time."
          exit 1

      - name: Run adversarial Playwright audit against public GitHub Pages
        working-directory: source
        env:
          SITE_URL: https://nikhilanand1998.github.io/espn-live-scores/
          REPORT_PATH: public-ui-adversarial-report.json
        run: node .github/scripts/ui-adversarial-playwright-v2.mjs

      - name: Verify lineup and actionable-faller semantics on public GitHub Pages
        working-directory: source
        env:
          SITE_URL: https://nikhilanand1998.github.io/espn-live-scores/
        run: node .github/scripts/lineup-semantics-playwright.mjs

      - name: Upload public-site adversarial report
        uses: actions/upload-artifact@v4
        with:
          name: pick9-public-ui-adversarial-review
          path: source/public-ui-adversarial-report.json
          if-no-files-found: error
