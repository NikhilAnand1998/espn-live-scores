name: Validate optimizer performance

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/validate-optimizer-performance.mjs
      - .github/workflows/validate-optimizer-performance.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DRAFTS_PER_SCENARIO: 20
      OUTCOMES_PER_DRAFT: 30
      MASTER_SEED: 20260905
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: source

      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site

      - name: Install validation dependencies
        working-directory: source
        run: |
          npm init -y >/dev/null
          npm install --save-exact cheerio@1.1.2 >/dev/null

      - name: Build the exact model being evaluated
        run: |
          node source/.github/scripts/build-draft-tree-data.mjs /tmp/pick9-data.js
          node source/.github/scripts/enrich-draft-tree-consensus.mjs /tmp/pick9-data.js
          node source/.github/scripts/enrich-draft-tree-external-models.mjs /tmp/pick9-data.js
          node source/.github/scripts/enrich-draft-tree-lineupbeat.mjs /tmp/pick9-data.js

      - name: Run paired out-of-sample validation
        id: validation
        continue-on-error: true
        working-directory: source
        run: node .github/scripts/validate-optimizer-performance.mjs /tmp/pick9-data.js draft-tree-site/engine.js draft-tree-site/engine-patch.js

      - name: Upload detailed validation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pick9-optimizer-validation
          path: source/optimizer-validation/

      - name: Publish the latest validation dashboard
        if: always()
        run: |
          rm -rf site/optimizer-validation
          mkdir -p site/optimizer-validation
          cp source/optimizer-validation/report.json site/optimizer-validation/report.json
          cp source/optimizer-validation/index.html site/optimizer-validation/index.html
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add optimizer-validation/
          git commit -m "Publish latest out-of-sample optimizer validation" || true
          git push origin HEAD:gh-pages

      - name: Enforce validation gates
        if: always()
        working-directory: source
        run: |
          node -e "const r=require('./optimizer-validation/report.json'); if(!r.validated){console.error('Optimizer validation gates failed'); process.exit(1)} console.log('All optimizer validation gates passed')"
