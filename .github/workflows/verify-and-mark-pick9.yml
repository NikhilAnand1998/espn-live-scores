name: Final deployed Pick 9 verification

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-and-mark-pick9.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-mark:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install matching Playwright package
        run: |
          npm init -y >/dev/null
          npm install --save-exact playwright@1.55.0 >/dev/null
      - name: Run deployed public-site suite
        run: node .github/scripts/verify-pick9-v2.mjs
      - name: Publish verification marker
        shell: bash
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/pick9-verified origin/gh-pages
          cd /tmp/pick9-verified
          printf '{"verified":true,"site":"https://nikhilanand1998.github.io/espn-live-scores/","suite":"Playwright deployed-site plus 3,000-mock validation","verified_at":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > verification-status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add verification-status.json
          git commit -m "Publish successful deployed-site verification"
          git push origin HEAD:gh-pages
