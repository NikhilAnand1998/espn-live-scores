name: Audit Draft Recommendations

on:
  push:
    branches: [main]
    paths:
      - .github/scripts/audit-draft-recommendations-v3.mjs
      - .github/workflows/audit-draft-recommendations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monte-carlo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SIMULATIONS: 5000
      SEED: 20260904
    steps:
      - name: Check out audit script
        uses: actions/checkout@v4
      - name: Install audit parser
        run: |
          npm init -y >/dev/null
          npm install --save-exact cheerio@1.1.2 >/dev/null
      - name: Run 15,000 exact-format mock draft paths
        run: node .github/scripts/audit-draft-recommendations-v3.mjs
